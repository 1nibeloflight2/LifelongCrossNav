PlanningConf:
  percentile_exploitation: 99.0  # in percents [in navigator.py]
  frontier_depth: 2.5  # in meters  [in navigator.py]
  no_nav_radius: 0.9 # in meters  [in navigator.py]
#  yolo_confidence: 0.5 # [in yolo_world_detector.py]
  yolo_confidence: 0.3 # legacy 2D YOLO-World field; MONActor3D does not use it
  yolov7_confidence: 0.7 # closed-vocabulary target detector threshold
  obj_confidence: 0.6 # secondary threshold for target object (non-stair) detections
  filter_detections_depth: False # [in navigator.py]
  consensus_filtering: True # [in navigator.py]  # For ablation. If set to false, the consensus filtering (CF) is disabled
  allow_replan: True # [in navigator.py]
  use_frontiers: True # [in navigator.py]
  allow_far_plan: False # [in navigator.py]
  using_ov: True # legacy 2D detector selector; MONActor3D uses YOLOv7 + SegFormer
  max_detect_distance: 0.8 # [in navigator.py]
  objectnav_found_distance: 1.3 # multi-object called_found distance
  single_objectnav_found_distance: 0.8 # OneMap-v1 single-object called_found distance
  obstcl_kernel_size: 0.5 # [in navigator.py]
  min_goal_dist: 0.7 # [in navigator.py]
  enable_history_poi: False
  history_poi_objectnav_match_xy_m: 1.0 # live detection must be this close to the active history POI bbox before takeover
  history_poi_objectnav_match_z_m: 1.0
  frontier_dirty_margin: 5
  frontier_missing_grace: 3
  frontier_normal_min_cluster_size: 5
  frontier_init_min_cluster_size: 2
  stair_sam_threshold: 0.689
  segformer_stair_model: "weights/segformer_b2_ade20k"
  segformer_stair_pixel_threshold: 0.25
  segformer_stair_min_area: 80
  segformer_stair_max_components: 8
  segformer_stair_fp16: True
  descend_pitched_conf_threshold: 0.48
  descend_pitched_sam_threshold: 0.48
  descend_geometry_threshold: 0.65
  descend_wait_frames: 5
  ascent_proposal_threshold: 0.55
  ascent_strong_threshold: 0.80
  ascent_required_seen: 2
  ascent_candidate_ttl: 10
  ascent_approach_distance: 0.60
  stair_force_forward_steps: 3
  stair_min_descent_layers: 3
  stair_descent_floor_confirm_frames: 3
  stair_descent_frontier_guard_distance: 0.30  # m; lower StairSem target blocks early exit
  stair_min_ascent_layers: 6
  stair_ascent_floor_confirm_frames: 3
  stair_sem_session_radius_m: 2.5 # 3-D metric radius linking stair voxels into the active StairSem session
  stair_sem_xy_refine_delay_frames: 3
  stair_replan_period: 3
  objectnav_miss_limit: 5
  objectnav_edge_oscillation_found_cycles: 5
  object_found_min_confidence: 0.7
  object_found_min_box_area_ratio: 0.015625
  object_found_min_mask_voxels: 10
  object_found_edge_margin_px: 8.0
  object_found_max_center_offset: 0.75
